# Project Identification
sonar.projectKey=mailer-go
sonar.projectName=mailer-go
sonar.organization=khw315
sonar.projectVersion=1.0.0

# Source Code Configuration
sonar.sources=.
sonar.exclusions=**/*_test.go,**/vendor/**,data/**,spool/**,scratch/**,**/*.md,**/*.yml,**/*.yaml,**/*.json,**/*.example,Dockerfile,LICENSE

# Test Configuration
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Coverage and Linting Reports
sonar.go.coverage.reportPaths=coverage.out
sonar.go.golangci-lint.reportPaths=golangci-lint.xml

# Encoding
sonar.sourceEncoding=UTF-8
